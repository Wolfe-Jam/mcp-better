# Official MCP conformance suite: known failures for mcp-better.
# Run: bash scripts/conformance.sh  (--requirements 2026-07-28, per-check entries).
#
# This baseline is for the textbook binary only. The conformance build
# (mcp-better-conformance: the same server plus the suite's fixtures and Tasks)
# runs with no baseline and must pass 100%.
#
# Every entry below is one of three kinds, nothing else:
#   fixture: the check calls a test tool, prompt or resource from the suite's own
#            reference server (test_*, json_schema_2020_12_tool, test://…), which a
#            textbook server does not ship.
#   tasks:   the Tasks extension (SEP-2663) is out of scope for this textbook.
#   not declared: completions are not declared, so completion/complete answers
#            method-not-found instead of the SDK's undeclared empty answer.
# A new failure that is neither fails CI; a fixed one fails CI until removed here.
