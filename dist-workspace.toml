# cargo-dist (durable binary release path for mcp-better)
# https://opensource.axo.dev/cargo-dist/
#
# First npm ship uses a hand-rolled shim (bin/mcp-better.js) that downloads
# artifacts from GitHub Releases. cargo-dist owns building + attaching those
# artifacts when a v* tag is pushed. Keep this file even if the shim is custom.

[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred cargo-dist version to use in CI (Rust SemVer subset)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin", # built on macos-15 (arm) via --target; not macos-13
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
# We ship a hand-rolled npm shim; no shell/powershell installers required.
installers = []
# Publish jobs to run on tag push
# (binaries only — npm/cargo publish stay in /pubbetter human motion)
# Whether dist should create a Github Release or use an existing draft
create-release = true
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Skip PR plan runs by default (keeps PR CI light; release path is tag-driven)
pr-run-mode = "skip"
# Only package the product binary (not teaching companion mcp-worse)
binaries = ["mcp-better"]
