[package]
name = "mcp-better"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
authors = ["Wolfe-Jam <wolfejam@faf.one>"]
description = "AAIF-verified modern MCP setup optimised to the 2026-07-28 model (BETTER textbook)."
license = "MIT"
repository = "https://github.com/Wolfe-Jam/mcp-better"
homepage = "https://github.com/Wolfe-Jam/mcp-better"
readme = "README.md"
keywords = ["mcp", "rmcp", "ai", "protocol", "stdio"]
categories = ["development-tools", "command-line-utilities"]
exclude = ["target/", ".git/"]

[dependencies]
anyhow = "1"
axum = "0.8"
rmcp = { version = "3.0", features = [
    "server",
    "client",
    "macros",
    "transport-io",
    "transport-child-process",
    "transport-streamable-http-server",
    "schemars",
] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "io-std",
    "io-util",
    "process",
    "net",
    "signal",
] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "mcp-better"
path = "src/main.rs"

[[bin]]
name = "mcp-worse"
path = "src/bin/mcp_worse.rs"

[[example]]
name = "stdio-client"
path = "examples/stdio_client.rs"

[[example]]
name = "http-smoke"
path = "examples/http_smoke.rs"

[[example]]
name = "order-restart-smoke"
path = "examples/order_restart_smoke.rs"

[[example]]
name = "contrast-smoke"
path = "examples/contrast_smoke.rs"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
