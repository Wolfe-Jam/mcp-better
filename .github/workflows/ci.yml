name: ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            conformance

      - name: three-file lockstep (doc-gate)
        run: bash scripts/doc-gate.sh

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.151

      # nextest runs the same tests as `cargo test --all-targets` and writes a
      # JUnit report (.config/nextest.toml) for the TAF receipt. It skips
      # doctests, so they run on their own below.
      - name: test
        run: cargo nextest run --profile ci --all-targets --no-fail-fast

      - name: Upload test report for the TAF receipt
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v7
        with:
          name: taf-test-output
          path: target/nextest/ci/junit.xml
          overwrite: true

      - name: doctests
        run: cargo test --doc

      - name: build release binary
        run: cargo build --release

      - name: no project.faf on main (BETTER purity)
        run: test ! -f project.faf && test ! -f .faf

      - name: stdio client smoke (Discover)
        run: |
          cargo build --bins
          cargo run --example stdio-client

      - name: MRTR matching client (confirm_echo R1 to R2)
        run: |
          MCP_BETTER_BIN="${{ github.workspace }}/target/debug/mcp-better" cargo run --example mrtr-client

      - name: order restart smoke (two processes)
        run: |
          MCP_BETTER_BIN="${{ github.workspace }}/target/debug/mcp-better" cargo run --example order-restart-smoke

      - name: contrast smoke (better passes · worse fails)
        run: |
          MCP_BETTER_BIN="${{ github.workspace }}/target/debug/mcp-better" \
            MCP_WORSE_BIN="${{ github.workspace }}/target/debug/mcp-worse" \
            cargo run --example contrast-smoke

      - name: Streamable HTTP smoke
        run: |
          # http-smoke spawns the bin; example alone does not build [[bin]]
          MCP_BETTER_BIN="${{ github.workspace }}/target/debug/mcp-better" cargo run --example http-smoke

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: official MCP conformance suite, textbook binary
        env:
          MCP_CONFORMANCE_OUT: ${{ runner.temp }}/conformance-textbook
        run: |
          # The textbook ships no suite fixtures and no Tasks: conformance-baseline.yml lists them
          MCP_BETTER_BIN="${{ github.workspace }}/target/debug/mcp-better" bash scripts/conformance.sh

      - name: conformance build (mcp-better + suite fixtures) fmt, clippy, build, test
        working-directory: conformance
        run: |
          cargo fmt -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo build --locked
          cargo test --locked

      - name: official MCP conformance suite, conformance build, no baseline (100%)
        env:
          MCP_CONFORMANCE_OUT: ${{ runner.temp }}/conformance-build
        run: |
          MCP_BETTER_BIN="${{ github.workspace }}/conformance/target/debug/mcp-better-conformance" \
            MCP_CONFORMANCE_BASELINE='' bash scripts/conformance.sh

      - name: keep conformance results when a run fails
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: conformance-results
          path: ${{ runner.temp }}/conformance-*
          if-no-files-found: ignore

      - name: Install rust-mcp-preflight
        uses: taiki-e/install-action@v2
        with:
          tool: rust-mcp-preflight@0.2.4

      - name: Registry listing (rust-mcp-preflight server.json)
        run: bash scripts/preflight.sh

  # TAF receipt: one per push to main, red runs included (FAILED), saved to the
  # taf-receipts branch by taf-git's receipt job, the only job that writes.
  # test-result is the whole check job: any failing step records FAILED.
  receipt:
    needs: check
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
    uses: Wolfe-Jam/taf-git/.github/workflows/receipt.yml@v3.0.1
    with:
      artifact-name: taf-test-output
      test-output-file: junit.xml
      test-result: ${{ needs.check.result }}

  msrv:
    # rust-version in Cargo.toml must stay true: build on exactly that toolchain.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88

      - uses: Swatinem/rust-cache@v2

      - name: cargo check --locked on the declared minimum
        run: cargo check --locked --all-targets
