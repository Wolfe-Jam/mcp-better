name: ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test --all-targets

      - name: build release binary
        run: cargo build --release

      - name: no project.faf on main (BETTER purity)
        run: test ! -f project.faf && test ! -f .faf

      - name: stdio client smoke (Discover)
        run: |
          cargo build --bins
          cargo run --example stdio-client

      - name: order restart smoke (two processes)
        run: |
          MCP_BETTER_BIN="${{ github.workspace }}/target/debug/mcp-better" cargo run --example order-restart-smoke

      - name: contrast smoke (better passes · worse fails)
        run: |
          MCP_BETTER_BIN="${{ github.workspace }}/target/debug/mcp-better" \
            MCP_WORSE_BIN="${{ github.workspace }}/target/debug/mcp-worse" \
            cargo run --example contrast-smoke

      - name: Streamable HTTP smoke
        run: |
          # http-smoke spawns the bin; example alone does not build [[bin]]
          MCP_BETTER_BIN="${{ github.workspace }}/target/debug/mcp-better" cargo run --example http-smoke
