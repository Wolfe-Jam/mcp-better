# mcp-better Release
#
# 1) Multi-arch native binaries → GitHub Release assets (npm shim downloads these)
#    (a pull request that changes this file builds and downloads them, attaches nothing)
# 2) On tag push only: OIDC publish to crates.io + npm (zero long-lived registry tokens)
#
# Prerequisites (one-time manual):
#   - crates.io Trusted Publishing → Wolfe-Jam/mcp-better, workflow release.yml, env release
#   - npm Trusted Publisher → same
#   - GitHub Environment `release` (protection optional: reviewers / v* tags)
#
# See docs/MCP-DIST-POST.md
#
# cargo-dist config: dist-workspace.toml (durable path).
# mcp-dist-post stays a local post-step (does not publish).
# MCP Registry still uses mcp-publisher (human / separate auth).

name: Release

on:
  push:
    tags:
      - "v*"
  # A change to this file builds every target and downloads the artifacts on the PR,
  # so a retired runner or a broken action shows up before a tag, not at publish time.
  # Nothing is attached or published from a pull request.
  pull_request:
    paths:
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach assets to (e.g. v0.4.1)"
        required: true
        default: "v0.4.1"

# Default: no tokens. Jobs elevate only what they need.
permissions: {}

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          # macos-13 retired — cross-compile x86_64 on arm64 macOS
          - runner: macos-15
            target: x86_64-apple-darwin
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          # SHA pin is not the floating @stable ref — toolchain must be explicit
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        shell: bash
        run: cargo build --release --bin mcp-better --target ${{ matrix.target }}

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          TRIPLE="${{ matrix.target }}"
          OUT="dist-out"
          mkdir -p "$OUT"
          if [[ "$TRIPLE" == *windows* ]]; then
            BIN="target/${TRIPLE}/release/mcp-better.exe"
            test -f "$BIN"
            STAGE="$OUT/stage"
            mkdir -p "$STAGE"
            cp "$BIN" "$STAGE/mcp-better.exe"
            (cd "$STAGE" && 7z a -tzip "../mcp-better-${TRIPLE}.zip" "mcp-better.exe")
          else
            BIN="target/${TRIPLE}/release/mcp-better"
            test -f "$BIN"
            STAGE="$OUT/stage"
            mkdir -p "$STAGE"
            cp "$BIN" "$STAGE/mcp-better"
            chmod +x "$STAGE/mcp-better"
            tar -C "$STAGE" -cJf "$OUT/mcp-better-${TRIPLE}.tar.xz" mcp-better
            tar -C "$STAGE" -czf "$OUT/mcp-better-${TRIPLE}.tar.gz" mcp-better
          fi
          ls -la "$OUT"

      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist-out/mcp-better-*.tar.xz
            dist-out/mcp-better-*.tar.gz
            dist-out/mcp-better-*.zip
          if-no-files-found: error

  # Attach binaries to the GitHub Release (not OIDC-sensitive)
  publish-release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: artifacts
          pattern: dist-*
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Attach to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: artifacts/**
          fail_on_unmatched_files: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── OIDC publish (tag push only — never workflow_dispatch / PR) ───────────
  # Requires Trusted Publishing + Environment `release` configured first.
  # Do NOT delete classic secrets until this job has succeeded once.
  publish-registries:
    needs: [build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # OIDC
      contents: read  # checkout only
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.ref }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - name: crates.io OIDC token
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
        id: crates-auth

      - name: cargo publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Lockstep + mcpName (mcp-dist-post dry-run)
        run: |
          ./scripts/mcp-dist-post.sh \
            --crate mcp-better \
            --mcp-name io.github.Wolfe-Jam/mcp-better \
            --dry-run

      - name: npm publish (OIDC Trusted Publishing — no NODE_AUTH_TOKEN)
        run: npm publish --access public
        # Trusted Publishing: do not set NODE_AUTH_TOKEN / NPM_TOKEN
